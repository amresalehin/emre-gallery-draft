name: Android build

on:
  push:
    branches:
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
      - 'research/**'
  pull_request:
    branches:
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
      - 'research/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run debug unit tests
        run: bash ./gradlew --no-daemon testDebugUnitTest

      - name: Assemble debug APK
        run: bash ./gradlew --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
