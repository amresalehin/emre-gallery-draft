name: Android build

on:
  push:
    branches:
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
  pull_request:
    branches:
      - Develop
      - 'integration/**'
      - 'fix/**'
      - 'chore/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Unit tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v7
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify build environment
        run: |
          java -version
          python --version
          python3.10 --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The Android Gradle Plugin supplies the standard debug signing key.
      - name: Run unit tests and assemble debug APK
        run: bash ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Verify debug APK package and signature
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          BUILD_TOOLS_DIR="$(find "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/aapt"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          "$BUILD_TOOLS_DIR/aapt" dump badging "$APK" | grep -F "package: name='com.amresalehin.emregallery'"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS_DIR/apksigner" verify --print-certs "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: emre-gallery-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
