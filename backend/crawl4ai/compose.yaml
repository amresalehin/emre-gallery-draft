services:
  crawl4ai:
    image: unclecode/crawl4ai:0.9.5
    container_name: emre-crawl4ai
    restart: unless-stopped
    init: true
    shm_size: 1gb
    ports:
      # Keep the crawler private on this machine by default.
      - "127.0.0.1:11235:11235"
    environment:
      CRAWL4AI_API_TOKEN: ${CRAWL4AI_API_TOKEN:?Set CRAWL4AI_API_TOKEN before starting Crawl4AI}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:11235/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
